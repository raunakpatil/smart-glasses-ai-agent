[project]
name = "ronie-brain"
version = "0.1.0"
description = "Ronie brain server: model router, pairing and mission control"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "qrcode>=7.4",
  "zeroconf>=0.132",
  "keyring>=25",
  "pypdf>=4",  # reading resumes for interview mode
  "soundcard>=0.4",  # hearing the interviewer from a call on the laptop
  "chess>=1.10",  # game mode: chess move validation & FEN analysis
]

[project.optional-dependencies]
# Paid, optional providers. OpenAI and DeepSeek use the OpenAI-compatible HTTP API, so only Claude needs an SDK.
claude = ["anthropic>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ronie-brain = "ronie_brain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ronie_brain*"]

[tool.setuptools.package-data]
ronie_brain = ["dashboard/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
